services:
  postgres:
    image: postgres:16
    container_name: chess-pairings-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: chess-pairings-app
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      BBP_PAIRINGS_BIN: ${BBP_PAIRINGS_BIN:-/usr/local/bin/bbpPairings}
      BBP_PAIRINGS_SYSTEM: ${BBP_PAIRINGS_SYSTEM:-dutch}
      FILES_BASE_URL: ${FILES_BASE_URL:-http://localhost:8010}
      PLAYER_LIST_FILE: ${PLAYER_LIST_FILE:-/app/data/players_list_foa.txt}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-12}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    container_name: chess-pairings-frontend
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8010}
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8010}
    depends_on:
      - app

volumes:
  postgres-data:
