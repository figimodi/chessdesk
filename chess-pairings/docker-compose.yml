services:
  postgres:
    image: postgres:16
    container_name: chess-pairings-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: chess-pairings-app
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
      BBP_PAIRINGS_BIN: ${BBP_PAIRINGS_BIN:-/usr/local/bin/bbpPairings}
      BBP_PAIRINGS_SYSTEM: ${BBP_PAIRINGS_SYSTEM:-dutch}
      FILES_BASE_URL: ${FILES_BASE_URL:-http://localhost:8010}
      PLAYER_LIST_FILE: ${PLAYER_LIST_FILE:-/app/data/players_list_foa.txt}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

  frontend:
    container_name: chess-pairings-frontend
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8010}
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8010}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app

volumes:
  postgres-data:
